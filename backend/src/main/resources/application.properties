# FinGuard Spring Boot Backend Configuration
# Batch Decision-Support Server: connects to MongoDB database 'finguard'
server.port=8080

spring.application.name=finguard-backend

# MongoDB Connection
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/finguard}

# Security & JWT Configuration
finguard.security.jwt.secret=${JWT_SECRET:finguard-secret-key-decision-support-analyst-2026-minimum-256-bits}
finguard.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configurable CORS (No wildcards)
finguard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Configurable Risk Thresholds
finguard.risk.low-threshold=40.0
finguard.risk.high-threshold=75.0

# Logging config
logging.level.com.finguard=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) [FinGuard] %clr(%-40.40logger{39}){cyan} : %m%n
